repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (repository-wide, auto-fix)
        entry: ./scripts/ruff-tool.sh check --fix src tests benchmark experiments
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format (repository-wide)
        entry: ./scripts/ruff-tool.sh format src tests benchmark experiments
        language: system
        pass_filenames: false
        always_run: true
